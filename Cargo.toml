[package]
name = "prunr"
version = "0.6.0"
edition = "2024"
description = "Dead code detector for Node.js, with CommonJS as a first-class citizen"
license = "MIT"
repository = "https://github.com/sugomi-dev/prunr"
publish = false

[dependencies]
dunce = "1"
globset = "0.4"
ignore = "0.4.35"
nodejs-built-in-modules = "1.0.0"
oxc_allocator = "0.160.0"
oxc_ast = "0.160.0"
oxc_parser = "0.160.0"
oxc_resolver = "11.24.3"
oxc_semantic = "0.160.0"
oxc_span = "0.160.0"
rayon = "1"
regex = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
