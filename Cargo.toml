[package]
name = "prunr"
version = "0.1.0"
edition = "2024"

[dependencies]
ignore = "0.4.35"
nodejs-built-in-modules = "1.0.0"
oxc_allocator = "0.160.0"
oxc_ast = "0.160.0"
oxc_parser = "0.160.0"
oxc_resolver = "11.24.3"
oxc_semantic = "0.160.0"
oxc_span = "0.160.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
tempfile = "3"
